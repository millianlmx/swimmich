name: Release

# A `v<version>` tag (v0.2.0) ships that version to TestFlight; a manual run
# ships the current main with the project's version. The unit tests gate it.
#
# Needs three repository secrets, from an App Store Connect API key with the
# App Manager role (App Store Connect › Users and Access › Integrations):
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (the .p8 file's content).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  testflight:
    name: TestFlight
    runs-on: [self-hosted, macOS, ARM64, xcode]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Unit tests
        run: Scripts/ci.sh

      - name: Archive and upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [[ -z "$ASC_KEY_ID" || -z "$ASC_ISSUER_ID" || -z "$ASC_KEY_P8" ]]; then
            echo "::error::ASC_KEY_ID, ASC_ISSUER_ID and ASC_KEY_P8 secrets are required"
            exit 1
          fi
          key="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$ASC_KEY_P8" >"$key"
          version=""
          [[ "$GITHUB_REF_TYPE" == "tag" ]] && version="${GITHUB_REF_NAME#v}"
          ASC_KEY_PATH="$key" Scripts/release.sh "$version"
