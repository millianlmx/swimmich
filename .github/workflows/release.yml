name: Release

# A `v<version>` tag (v0.2.0) ships that version to TestFlight; a manual run
# ships the current main with the project's version. The unit tests gate it.
#
# Signing and upload use, in order: an App Store Connect API key (App Manager
# role) when the repository has the three secrets ASC_KEY_ID, ASC_ISSUER_ID,
# ASC_KEY_P8 (the .p8 content); otherwise the Apple ID signed in to Xcode on the
# runner's Mac, for the user the runner service runs as.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  testflight:
    name: TestFlight
    runs-on: [self-hosted, macOS, ARM64, xcode]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Unit tests
        run: Scripts/ci.sh

      - name: Archive and upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [[ -n "$ASC_KEY_ID" && -n "$ASC_ISSUER_ID" && -n "$ASC_KEY_P8" ]]; then
            key="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
            trap 'rm -f "$key"' EXIT
            printf '%s\n' "$ASC_KEY_P8" >"$key"
            export ASC_KEY_PATH="$key"
          else
            unset ASC_KEY_ID ASC_ISSUER_ID
          fi
          unset ASC_KEY_P8
          version=""
          [[ "$GITHUB_REF_TYPE" == "tag" ]] && version="${GITHUB_REF_NAME#v}"
          Scripts/release.sh "$version"
