name: CI

# Every push to this repository, any branch: the omp harness pushes its run
# branch and judges the checks of that exact SHA. No `pull_request` trigger on
# purpose: the runner is a self-hosted Mac, and a fork's pull request must never
# run code on it.
#
# Two suites (`SWIMMICH_CI_UI_SCOPE` of Scripts/ci.sh):
#
# * the gate, on every push: the build, the unit tests, the i18n audit, the UI
#   scenarios the push changed and the smoke lines of Scripts/ci-ui-scenarios.txt.
#   Under 10 minutes; it is the check the branch protection of `main` requires.
# * the full suite, every UI scenario of the list (about 50 minutes): every night
#   on `main`, on a `v*` tag before its IPA, and on demand (Run workflow, "full").
#   A scenario outside the smoke lines that a merge broke turns the night's run
#   red: it is fixed the next morning, it does not hold every push for an hour.
#
# On `main` and on `v*` tags, once the gate passes (and, on a tag, the full
# suite), a last job archives in Release and keeps the IPA signed for the App
# Store as an artifact. Nothing is uploaded to App Store Connect.
on:
  push:
  schedule:
    # 03:23 UTC. A schedule only runs on the default branch.
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: Also run the full UI suite (about 50 minutes)
        type: boolean
        default: false

# Per ref and per event: a push to `main` cancels the gate of the push before it,
# not the night's full suite (which has its own group below).
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    # Required by the branch protection of `main` under this exact name.
    name: Unit tests (iOS simulator)
    # The night's run is the full suite alone: it runs the unit tests too.
    if: github.event_name != 'schedule'
    runs-on: [self-hosted, macOS, ARM64, xcode]
    timeout-minutes: 45
    env:
      SWIMMICH_CI_UI_SCOPE: gate
      # What the changed scenarios are read against: `main` for a branch, and for
      # a push to `main` the commit it pointed at before the push.
      SWIMMICH_CI_UI_BASE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.before || 'main' }}
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          xcodegen --version

      - name: Build, run unit tests and the gate's UI scenarios
        run: Scripts/ci.sh

      - name: Keep the result bundles and stub logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/ci/
          retention-days: 7

  ui-full:
    name: Full UI suite (iOS simulator)
    if: >-
      github.event_name == 'schedule'
      || startsWith(github.ref, 'refs/tags/v')
      || (github.event_name == 'workflow_dispatch' && inputs.full)
    runs-on: [self-hosted, macOS, ARM64, xcode]
    timeout-minutes: 120
    # One full suite at a time on the whole repository, never cancelled: the
    # runners share one Mac, and two full suites side by side (two pools of
    # simulators) take longer than one after the other.
    concurrency:
      group: ci-ui-full
      cancel-in-progress: false
    env:
      SWIMMICH_CI_UI_SCOPE: all
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          xcodegen --version

      - name: Build, run unit tests and every listed UI scenario
        run: Scripts/ci.sh

      - name: Keep the result bundles and stub logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-full
          path: build/ci/
          retention-days: 7

  ipa:
    name: Signed IPA
    needs: [unit-tests, ui-full]
    # A skipped `ui-full` (a push to `main`) does not hold the IPA; a failed one
    # (a tag) does. `always()`: without it a skipped need skips this job.
    if: >-
      always()
      && needs.unit-tests.result == 'success'
      && (needs.ui-full.result == 'success' || needs.ui-full.result == 'skipped')
      && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: [self-hosted, macOS, ARM64, xcode]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Signed with the Apple ID signed in to Xcode on the runner's Mac (see
      # Scripts/ipa.sh). The runner's LaunchAgent must not set SessionCreate:
      # in a new security session codesign cannot reach the login keychain
      # (errSecInternalComponent).
      - name: Archive and export
        run: |
          version=""
          [[ "$GITHUB_REF_TYPE" == "tag" ]] && version="${GITHUB_REF_NAME#v}"
          Scripts/ipa.sh "$version"

      - name: Keep the IPA
        uses: actions/upload-artifact@v4
        with:
          name: swimmich-ipa
          path: build/ipa/Swimmich.ipa
          retention-days: 14
