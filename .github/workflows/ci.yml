name: CI

# Every push to this repository, any branch: the omp harness pushes its run
# branch and judges the checks of that exact SHA. No `pull_request` trigger on
# purpose: the runner is a self-hosted Mac, and a fork's pull request must never
# run code on it.
#
# Three suites over one list, Scripts/ci-ui-scenarios.txt, whose lines carry a
# tier (`SWIMMICH_CI_UI_SCOPE` of Scripts/ci.sh, Scripts/ci_ui_select.py):
#
# * the gate, on every push: the build, the unit tests, the i18n audit, the UI
#   scenarios the push changed and the smoke lines, one per free simulator.
#   Under 5 minutes (`SWIMMICH_CI_GATE_BUDGET`); it is the check the branch
#   protection of `main` requires.
# * the core suite, every night on `main`: the smoke lines and the journeys and
#   sole proofs of each feature (about 25 minutes). A scenario a merge broke
#   turns the night's run red: fixed the next morning, it does not hold every
#   push for an hour.
# * the release suite, every line (about 50 minutes): on Sunday night, and on a
#   `v*` tag before its IPA.
#
# Run workflow offers the three (`suite`). Run on a `v*` tag with `gate`, it sends
# the build after the gate alone, without the release suite: the maintainer's
# explicit choice when that suite is red for reasons the release does not touch.
#
# On `main`, once the gate passes, a last job archives in Release and keeps the
# IPA signed for the App Store by the Apple ID of the Mac as an artifact; nothing
# is sent. On a `v*` tag, once the gate and the release suite pass, the job
# "App Store upload" signs with the secrets of the GitHub Environment
# `app-store` (limited to `v*` tags) and sends the build to App Store Connect.
# Those secrets are read by that job only.
#
# The job "README screenshots" does nothing once the five pictures of the READMEs
# are committed under docs/screenshots/. While one is missing it takes them on the
# runner, pushes them to the branch `ci/readme-screenshots` (a push by the job's
# token starts no workflow) and fails, saying so: the pictures are then committed
# on the tested branch.
#
# The job "Search captures" photographs the Search tab (Scripts/ci-search-captures.sh).
# The series that Scripts/search-captures-series names (`before` or `after`) is taken
# and pushed to the branch `ci/search-captures-<series>` by the branch that owns it;
# the other branches never touch it.
on:
  push:
  schedule:
    # 03:23 UTC. A schedule only runs on the default branch. Monday to Saturday:
    # the core suite; Sunday: the release suite (see `ui-suite` below).
    - cron: "23 3 * * 1-6"
    - cron: "23 3 * * 0"
  workflow_dispatch:
    inputs:
      suite:
        description: UI scenarios to run beside the gate
        type: choice
        options: [gate, core, all]
        default: gate

# Per ref and per event: a push to `main` cancels the gate of the push before it,
# not the night's suite (which has its own group below).
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    # Required by the branch protection of `main` under this exact name.
    name: Unit tests (iOS simulator)
    # A scheduled run is the suite alone: it runs the unit tests too.
    if: github.event_name != 'schedule'
    runs-on: [self-hosted, macOS, ARM64, xcode]
    timeout-minutes: 45
    env:
      SWIMMICH_CI_UI_SCOPE: gate
      # What the changed scenarios are read against: `main` for a branch, and for
      # a push to `main` the commit it pointed at before the push.
      SWIMMICH_CI_UI_BASE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.before || 'main' }}
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          xcodegen --version

      - name: Build, run unit tests and the gate's UI scenarios
        run: Scripts/ci.sh

      - name: Keep the result bundles and stub logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/ci/
          retention-days: 7

  readme-screenshots:
    name: README screenshots
    # Even when the unit tests failed: they fail precisely while a screenshot is missing.
    needs: unit-tests
    if: ${{ !cancelled() && github.event_name == 'push' }}
    runs-on: [self-hosted, macOS, ARM64, xcode]
    timeout-minutes: 60
    # One of the two jobs that write to the repository (with search-captures); the workflow default is read-only.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Capture the README screenshots when one is missing
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: Scripts/ci-readme-screenshots.sh

  search-captures:
    name: Search captures
    # The before/after pictures of the Search redesign (Scripts/ci-search-captures.sh).
    needs: unit-tests
    if: ${{ !cancelled() && github.event_name == 'push' }}
    runs-on: [self-hosted, macOS, ARM64, xcode]
    timeout-minutes: 60
    # Pushes only its series branch ci/search-captures-<series>.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Capture the Search screens of the series this branch owns
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: Scripts/ci-search-captures.sh

  ui-suite:
    name: UI suite (iOS simulator)
    if: >-
      github.event_name == 'schedule'
      || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
      || (github.event_name == 'workflow_dispatch' && inputs.suite != 'gate')
    runs-on: [self-hosted, macOS, ARM64, xcode]
    timeout-minutes: 120
    # One suite at a time on the whole repository, never cancelled: the runners
    # share one Mac, and two suites side by side (two pools of simulators) take
    # longer than one after the other.
    concurrency:
      group: ci-ui-suite
      cancel-in-progress: false
    env:
      # The core suite on a weekday night (or asked for); every line otherwise:
      # Sunday night, a release tag, "all".
      SWIMMICH_CI_UI_SCOPE: ${{ (github.event.schedule == '23 3 * * 1-6' || inputs.suite == 'core') && 'core' || 'all' }}
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          xcodegen --version

      - name: Build, run unit tests and the suite's UI scenarios
        run: Scripts/ci.sh

      - name: Keep the result bundles and stub logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-suite
          path: build/ci/
          retention-days: 7

  ipa:
    name: Signed IPA
    needs: [unit-tests, ui-suite]
    # A skipped `ui-suite` (a push to `main`) does not hold the IPA.
    # `always()`: without it a skipped need skips this job.
    if: >-
      always()
      && needs.unit-tests.result == 'success'
      && (needs.ui-suite.result == 'success' || needs.ui-suite.result == 'skipped')
      && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, macOS, ARM64, xcode]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Signed with the Apple ID signed in to Xcode on the runner's Mac (see
      # Scripts/ipa.sh). The runner's LaunchAgent must not set SessionCreate:
      # in a new security session codesign cannot reach the login keychain
      # (errSecInternalComponent).
      - name: Archive and export
        run: Scripts/ipa.sh

      - name: Keep the IPA
        uses: actions/upload-artifact@v4
        with:
          name: swimmich-ipa
          path: build/ipa/Swimmich.ipa
          retention-days: 14

  appstore:
    name: App Store upload
    # No `always()`: a gate or release suite that did not succeed skips this job,
    # and nothing is sent. The release suite is skipped only when a maintainer
    # runs the workflow on the tag with `suite: gate` (see the top of this file).
    needs: [unit-tests, ui-suite]
    if: startsWith(github.ref, 'refs/tags/v') && !cancelled() && needs.unit-tests.result == 'success' && (needs.ui-suite.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.suite == 'gate' && needs.ui-suite.result == 'skipped'))
    runs-on: [self-hosted, macOS, ARM64, xcode]
    timeout-minutes: 60
    # The secrets of the Environment are released to this job only, and only for
    # a `v*` tag (deployment rule of the Environment, see README, Release).
    environment: app-store
    # Not shared with `ipa`: a group holds one waiting job and cancels the
    # others, so a push to `main` could cancel an upload.
    concurrency:
      group: appstore-upload
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      # Scripts/release.sh signs from the secrets alone, in a temporary keychain,
      # and names every missing secret before it touches a signing tool.
      - name: Archive, sign and upload
        env:
          APPLE_DISTRIBUTION_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          APPLE_DISTRIBUTION_P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
          PROFILE_APP_BASE64: ${{ secrets.PROFILE_APP_BASE64 }}
          PROFILE_WIDGETS_BASE64: ${{ secrets.PROFILE_WIDGETS_BASE64 }}
          PROFILE_SHARE_EXTENSION_BASE64: ${{ secrets.PROFILE_SHARE_EXTENSION_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: Scripts/release.sh "$GITHUB_REF_NAME"

      - name: Keep the IPA
        uses: actions/upload-artifact@v4
        with:
          name: swimmich-ipa
          path: build/ipa/Swimmich.ipa
          retention-days: 14

      - name: Remove the signing state
        if: always()
        run: Scripts/release.sh --cleanup
