name: CI

# Every push to this repository, any branch: the omp harness pushes its run
# branch and judges the checks of that exact SHA. No `pull_request` trigger on
# purpose: the runner is a self-hosted Mac, and a fork's pull request must never
# run code on it.
#
# On `main` and on `v*` tags, once the unit tests pass, a second job archives
# in Release and keeps the IPA signed for the App Store as an artifact. Nothing
# is uploaded to App Store Connect.
on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    # Required by the branch protection of `main` under this exact name.
    name: Unit tests (iOS simulator)
    runs-on: [self-hosted, macOS, ARM64, xcode]
    # Unit tests, then the UI scenarios of Scripts/ci-ui-scenarios.txt.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          xcodegen --version

      - name: Build, run unit tests and listed UI scenarios
        run: Scripts/ci.sh

      - name: Keep the result bundles and stub logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/ci/
          retention-days: 7

  ipa:
    name: Signed IPA
    needs: unit-tests
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, macOS, ARM64, xcode]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Signed with the Apple ID signed in to Xcode on the runner's Mac (see
      # Scripts/ipa.sh). The runner's LaunchAgent must not set SessionCreate:
      # in a new security session codesign cannot reach the login keychain
      # (errSecInternalComponent).
      - name: Archive and export
        run: |
          version=""
          [[ "$GITHUB_REF_TYPE" == "tag" ]] && version="${GITHUB_REF_NAME#v}"
          Scripts/ipa.sh "$version"

      - name: Keep the IPA
        uses: actions/upload-artifact@v4
        with:
          name: swimmich-ipa
          path: build/ipa/Swimmich.ipa
          retention-days: 14
