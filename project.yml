name: ImmichSwiftUI
options:
  bundleIdPrefix: app.immich
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
packages:
  SocketIO:
    url: https://github.com/socketio/socket.io-client-swift
    from: 16.1.0
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: minimal
    GENERATE_INFOPLIST_FILE: NO
targets:
  ImmichSwiftUI:
    type: application
    platform: iOS
    sources:
      - path: Sources
        # `Sources/ImmichSharedKit` is compiled into this module as well, but its
        # privacy manifest belongs to the framework bundle only: a second
        # `PrivacyInfo.xcprivacy` in the app's resources collides with the app's
        # own (Resources/PrivacyInfo.xcprivacy) at the bundle root.
        excludes:
          - "ImmichSharedKit/PrivacyInfo.xcprivacy"
      # The share sheet's model and its view model are compiled into the app
      # module as well. They hold no UI and no extension API — only the
      # protocol seam — and the card requires the tests that exercise them to
      # `@testable import ImmichSwiftUI` (a unit-test bundle cannot link an
      # .appex). The sheet's view and its view controller stay extension-only.
      - path: ImmichShareExtension/ShareItem.swift
      - path: ImmichShareExtension/ShareExtensionViewModel.swift
      - path: Resources/Assets.xcassets
        buildPhase: resources
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
      - path: Resources/TeslaCar.usdz
        buildPhase: resources
      # Third-party attribution (gap G23). XcodeGen enumerates resources one by
      # one, so a new folder is not copied until it is listed: without this the
      # Licenses screen cannot resolve a single file.
      - path: Resources/Acknowledgements
        buildPhase: resources
      # Privacy manifest (required-reason APIs). Every shipped bundle with code
      # of ours carries its own: this one, ImmichWidgets/, ImmichShareExtension/
      # and Sources/ImmichSharedKit/ — the last three are picked up by their
      # target's source folder. Collected data types stay empty on purpose: no
      # analytics, no tracking, and photos/email/device id only ever reach the
      # Immich server the user signs in to, which we never get to read.
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Swimmich
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: AccentColor
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSPhotoLibraryUsageDescription: "Swimmich needs Photos access to upload and back up your library."
        NSPhotoLibraryAddUsageDescription: "Swimmich needs Photos access to add uploaded assets."
        NSFaceIDUsageDescription: "Swimmich uses Face ID to unlock the app."
        NSCameraUsageDescription: "Swimmich uses the camera to scan server configuration QR codes."
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        BGTaskSchedulerPermittedIdentifiers:
          - app.immich.background-backup
        UIBackgroundModes:
          - processing
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # NSAllowsArbitraryLoads is deliberate and must stay. Swimmich talks to a
        # self-hosted Immich server whose URL the user types at sign-in: it is
        # unknown at build time, so it cannot be listed in NSExceptionDomains, and
        # it is often plain HTTP on the LAN or behind a private domain name
        # (nas.home.lan, *.home.arpa, *.ts.net). NSAllowsLocalNetworking is no
        # alternative: it still blocks HTTP to private FQDNs, and its presence makes
        # iOS ignore NSAllowsArbitraryLoads. HTTPS stays the default for input
        # without a scheme. App Review justification: docs/app-review-ats.txt.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - app.immich
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.millianlmx.immich-ios
        DEVELOPMENT_TEAM: 2MJF39L8VY
        # iPhone only. xcodegen's iOS preset sets "1,2" at target level, which
        # beats the project-level settings, so every target repeats "1". A
        # universal binary with portrait-only orientations and no
        # UIRequiresFullScreen is rejected at upload (ITMS-90474).
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Resources/Info.plist
        # Keychain group shared with the widget and the share extension: the app
        # writes the widget session, both extensions read it. All three
        # entitlements declare the SAME group, and it is deliberately not the
        # bundle-id-derived one — renaming a target's bundle id no longer moves
        # it. Apple's rule for `kSecAttrAccessGroup` is what lets the code stay
        # group-agnostic: an app's access groups are, in order, the keychain
        # entitlement's strings, then the app ID; a write with no explicit group
        # lands in the FIRST of them. So the app's writes go to this group and
        # the extensions, which list it, read them.
        # The profile must authorise the group for each App ID (Keychain Sharing
        # capability), or iOS refuses to launch the extension at all — silently;
        # `WidgetExtensionProbe` says so at launch.
        # The entitlements files must stay comment-free: Xcode re-serialises
        # them during the build, and the build fails if its input changed.
        CODE_SIGN_ENTITLEMENTS: Resources/ImmichSwiftUI.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: ImmichSharedKit
        embed: true
      - target: ImmichWidgets
        embed: true
      - target: ImmichShareExtension
        embed: true
      - package: SocketIO
        product: SocketIO
  ImmichSharedKit:
    type: framework
    platform: iOS
    sources:
      - path: Sources/ImmichSharedKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.millianlmx.immich-ios.sharedkit
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "0.1.0"
        SWIFT_VERSION: "5.9"
  ImmichWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: ImmichWidgets
      # Same catalog as the app: widget copy is read out of the extension's own
      # bundle (`Bundle.main` inside the widget process is the extension), so
      # without this every widget string would fall back to English.
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
    info:
      path: ImmichWidgets/Info.plist
      properties:
        CFBundleDisplayName: Swimmich
        # Same versions as the containing app. xcodegen hardcodes 1.0/1 here
        # otherwise, and an extension whose version does not match its app is a
        # launch-and-store problem waiting to happen (the app ships 0.1.0).
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Same policy as the app, and for the same reason: the widget loads from the
        # user's self-hosted Immich server, whose URL the user types at sign-in and
        # is unknown at build time (often plain HTTP on the LAN or a private domain
        # name), so neither NSExceptionDomains nor NSAllowsLocalNetworking can
        # replace it. ATS applies to the extension process on its own. Loopback is
        # exempt from ATS, so a simulator test against 127.0.0.1 never noticed
        # (issue #19 follow-up). See docs/app-review-ats.txt.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.millianlmx.immich-ios.widgets
        DEVELOPMENT_TEAM: 2MJF39L8VY
        TARGETED_DEVICE_FAMILY: "1"
        # Read side of the same sharing; see the app target's comment.
        CODE_SIGN_ENTITLEMENTS: Resources/ImmichWidgets.entitlements
    dependencies:
      - target: ImmichSharedKit
        embed: true
  ImmichShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ImmichShareExtension
      # The app's design tokens (spacing, radius, fonts, brand colours) are
      # compiled into the extension as well. The app target compiles `Sources/`
      # as one flat entry, so the tokens belong to no framework an extension
      # could link — without this the sheet would re-invent the app's type
      # scale, which the UI brief forbids. Only `Tokens/` travels:
      # `Components/` pulls app-only types and must not enter an extension.
      - path: Sources/DesignSystem/Tokens
      # Same catalog as the app. The sheet draws its own copy, so without this
      # every string would fall back to English inside the extension process.
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
      # The structural tokens (BgSecondary, SeparatorColor, …) are asset-catalog
      # coloursets; without the catalog in the extension bundle they resolve to
      # nothing and the sheet renders untinted.
      - path: Resources/Assets.xcassets
        buildPhase: resources
    info:
      path: ImmichShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Swimmich
        # Same versions as the containing app, for the same reason as the
        # widget: an extension whose version drifts from its app is a
        # launch-and-store rejection waiting to happen.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Same policy as the app and the widget: uploads go to the user's
        # self-hosted Immich server, whose URL the user types at sign-in and is
        # unknown at build time (often plain HTTP on the LAN or a private domain
        # name), so neither NSExceptionDomains nor NSAllowsLocalNetworking can
        # replace it. ATS applies to the extension process on its own. Loopback is
        # exempt from ATS, so a simulator run against 127.0.0.1 never notices.
        # See docs/app-review-ats.txt.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            PHSupportedMediaTypes:
              - Image
              - Video
            # Same shape as the upstream Flutter share extension: at least one
            # attachment that conforms to image or movie. No storyboard key —
            # the principal class builds the UI host itself.
            NSExtensionActivationRule: 'SUBQUERY(extensionItems, $extensionItem, SUBQUERY($extensionItem.attachments, $attachment, ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.image" OR ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.movie").@count >= 1).@count >= 1'
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.millianlmx.immich-ios.share-extension
        DEVELOPMENT_TEAM: 2MJF39L8VY
        TARGETED_DEVICE_FAMILY: "1"
        # Write side is the app, read side is this extension; same derived
        # keychain group, so no access group is hardcoded anywhere.
        CODE_SIGN_ENTITLEMENTS: Resources/ImmichShareExtension.entitlements
    dependencies:
      - target: ImmichSharedKit
        embed: true
  ImmichSwiftUITests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: ImmichSwiftUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.immich.swiftui.tests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
  ImmichSwiftUIUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
        # XcodeGen enumerates `UITests` recursively and every file it finds
        # becomes a bundle member; these two trees must not. `stubs/tools` holds
        # the standalone macOS fixture generator (`make_video_fixture.swift` has
        # top-level code — compiling it into a test bundle fails with
        # "expressions are not allowed at the top level"), and `stubs/fixtures`
        # is served from disk by the stub server, never read out of the bundle.
        excludes:
          - "stubs/tools/**"
          - "stubs/fixtures/**"
    dependencies:
      - target: ImmichSwiftUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.immich.swiftui.uitests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: ImmichSwiftUI
schemes:
  ImmichSwiftUI:
    build:
      targets:
        ImmichSwiftUI: all
        ImmichWidgets: all
        ImmichShareExtension: all
        ImmichSwiftUITests: [test]
        ImmichSwiftUIUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ImmichSwiftUITests
        - ImmichSwiftUIUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
